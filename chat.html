<!DOCTYPE html>
<html lang="pt-MZ">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat - ServMoz</title>

<link rel="stylesheet" href="css/chat.css">

</head>


<body>


<div class="chat-app">



<!-- LISTA DE CONVERSAS -->


<div class="contacts">


<div class="chat-logo">

Serv<span>Moz</span>

</div>



<h2>
Mensagens
</h2>



<div class="contact active">


<img src="images/perfil.jpg">


<div>

<h3>
João Manuel
</h3>

<p>
Canalizador
</p>


</div>


</div>



<div class="contact">


<img src="images/perfil2.jpg">


<div>

<h3>
Empresa ABC
</h3>


<p>
Orçamento solicitado
</p>


</div>


</div>



</div>







<!-- ÁREA DA CONVERSA -->


<div class="conversation">



<div class="chat-header">


<img src="images/perfil.jpg">


<div>

<h3>
João Manuel
</h3>


<p>
Online
</p>


</div>


</div>





<div class="messages">



<div class="message received">

Olá, preciso de um orçamento para canalização.

</div>




<div class="message sent">

Olá! Posso ajudar. Envie a localização.

</div>



</div>






<div class="send-box">


<input 
id="messageInput"
placeholder="Escreva uma mensagem..."
>


<button id="send">

Enviar

</button>


</div>




</div>




</div>




<script src="js/chat.js"></script>


</body>

</html>
