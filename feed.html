<!DOCTYPE html>
<html lang="pt-MZ">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feed - ServMoz</title>

<link rel="stylesheet" href="css/feed.css">

</head>


<body>


<header class="top">

<div class="logo">
Serv<span>Moz</span>
</div>


<div class="search">

<input placeholder="Pesquisar serviços...">

</div>


</header>




<div class="container">



<!-- CRIAR PUBLICAÇÃO -->


<div class="create-post">


<div class="user">

<img src="images/perfil.jpg">

<input 
placeholder="O que você está a fazer hoje?"
>


</div>


<div class="post-options">

<button>
📷 Foto
</button>


<button>
🎥 Vídeo
</button>


<button>
📍 Localização
</button>

</div>


<button class="publish">

Publicar

</button>


</div>





<!-- PUBLICAÇÃO -->


<div class="post">


<div class="post-header">


<img src="images/perfil.jpg">


<div>

<h3>
João Manuel
</h3>

<p>
Canalizador • Matola
</p>

</div>


</div>



<p class="description">

Novo projeto concluído!
Instalação hidráulica residencial.

Obrigado pela confiança.

</p>




<img class="work-image" 
src="images/trabalho1.jpg">





<div class="actions">

<button>
❤️ Curtir
</button>


<button>
💬 Comentar
</button>


<button>
📤 Partilhar
</button>


</div>




<div class="comments">


<p>
Carlos: Excelente trabalho!
</p>


<p>
Maria: Preciso desse serviço.
</p>


</div>



</div>






</div>



<nav class="bottom-menu">


<a>🏠</a>

<a>🔍</a>

<a>➕</a>

<a>💬</a>

<a>👤</a>


</nav>



<script src="js/feed.js"></script>


</body>

</html>
